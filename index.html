<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8/3 tặng 12A1 NCT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600&family=Pacifico&display=swap');

        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            touch-action: manipulation;
        }

        /* --- MÂY TRẮNG --- */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 100px;
            opacity: 0.8; 
            filter: blur(5px);
            z-index: 1;
            animation: moveClouds linear infinite;
        }
        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .cloud::after { width: 50px; height: 50px; top: -25px; left: 25px; }
        .cloud::before { width: 40px; height: 40px; top: -15px; left: 70px; }

        @keyframes moveClouds {
            from { left: -200px; }
            to { left: 100%; }
        }

        /* --- CHỮ CHÚC MỪNG --- */
        .header {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .header h1, .header .main-wish, .header .sub-wish {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .header.show h1 { opacity: 1; transform: translateY(0); }
        .header.show .main-wish { opacity: 1; transform: translateY(0); transition-delay: 0.6s; }
        .header.show .sub-wish { opacity: 1; transform: translateY(0); transition-delay: 1.2s; }

        .header h1 {
            font-size: 1.9rem;
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(to right, #c9184a, #ff4d6d, #ff758f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
        }

        .header .main-wish {
            color: #800f2f;
            font-size: 0.9rem;
            margin-top: 15px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
        }

        .header .sub-wish {
            color: #c9184a;
            font-size: 0.85rem;
            margin-top: 10px;
            font-family: 'Pacifico', cursive;
        }

        .hint {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4d6d;
            font-size: 1rem;
            text-align: center;
            animation: blink 2s infinite;
            z-index: 101;
            width: 100%;
        }

        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        canvas { display: block; position: absolute; bottom: 0; left: 0; z-index: 10; }

        @media (min-width: 768px) {
            .header h1 { font-size: 3rem; }
            .header .main-wish { font-size: 1.4rem; }
            .header .sub-wish { font-size: 1.2rem; }
        }
    </style>
</head>
<body onclick="startEverything()" ontouchstart="startEverything()">

    <div class="cloud" style="width: 120px; height: 40px; top: 10%; animation-duration: 25s;"></div>
    <div class="cloud" style="width: 180px; height: 50px; top: 22%; animation-duration: 35s; animation-delay: -5s;"></div>

    <audio id="bgMusic" loop>
        <source src="nhacnen.mp3" type="audio/mpeg">
    </audio>

    <div class="header" id="mainHeader">
        <h1>Gửi những bông hoa<br>xinh đẹp nhất 12A1</h1>
        <p class="main-wish">Chúc các bạn một ngày 8/3 rạng rỡ, tỏa sáng và thành công!</p>
        <p class="sub-wish">Mãi là những đóa hoa rạng rỡ nhất ✨</p>
    </div>

    <div class="hint" id="hintText">
        🌸 Chạm vào màn hình để mở quà... 🌸
    </div>

    <canvas id="gardenCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gardenCanvas');
        const ctx = canvas.getContext('2d');
        const music = document.getElementById('bgMusic');
        const hint = document.getElementById('hintText');
        const header = document.getElementById('mainHeader');

        let isStarted = false;
        let frame = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(isStarted) init(); 
        }
        window.addEventListener('resize', resize);
        resize();

        function startEverything() {
            if (!isStarted) {
                music.play().catch(() => {});
                isStarted = true;
                hint.style.display = 'none'; 
                header.classList.add('show');
                init();
            }
        }

        const hearts = [];
        function spawnHeart() {
            if (isStarted && frame % 45 === 0) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height + 20,
                    size: Math.random() * 5 + 3,
                    speed: Math.random() * 1.2 + 0.5,
                    life: 1.0
                });
            }
        }

        class Flower {
            constructor(startX, startY, angle, scale, maxLen, delay) {
                this.startX = startX; this.startY = startY;
                this.angle = angle; this.scale = scale;
                this.delay = delay; this.stemLen = 0;
                this.maxStemLen = maxLen; this.bloom = 0;
                this.swayOffset = Math.random() * Math.PI * 2;
            }

            drawLeaf(length, width, color, isPetal = false) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(width/2, -length*0.2, width/1.5, -length*0.6, 0, -length);
                ctx.bezierCurveTo(-width/1.5, -length*0.6, -width/2, -length*0.2, 0, 0);
                let grad = ctx.createLinearGradient(0, 0, 0, -length);
                if (isPetal) {
                    grad.addColorStop(0, '#800f2f'); grad.addColorStop(0.5, color); grad.addColorStop(1, '#ff758f');
                } else {
                    grad.addColorStop(0, '#132a13'); grad.addColorStop(1, '#2d6a4f');
                }
                ctx.fillStyle = grad; ctx.fill();
            }

            update() {
                if (isStarted && frame > this.delay) {
                    let stemGap = this.maxStemLen - this.stemLen;
                    if (stemGap > 0.1) this.stemLen += stemGap * 0.015 + 0.15; 
                    if (this.stemLen > this.maxStemLen * 0.6) {
                        let bloomGap = 1 - this.bloom;
                        if (bloomGap > 0.005) this.bloom += bloomGap * 0.012;
                    }
                }
            }

            draw() {
                this.update();
                if (this.stemLen <= 0) return;
                const sway = Math.sin(frame * 0.015 + this.swayOffset) * 0.02;
                ctx.save();
                ctx.translate(this.startX, this.startY);
                ctx.rotate(this.angle + sway);
                
                // Thân cây
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(0, -this.stemLen);
                ctx.strokeStyle = '#1b4332'; ctx.lineWidth = 6 * this.scale;
                ctx.lineCap = 'round'; ctx.stroke();
                
                // Lá
                if (this.stemLen > 40) {
                    for(let i=1; i<=2; i++) {
                        ctx.save();
                        ctx.translate(0, -this.stemLen * (i/3.5)); 
                        ctx.rotate(i % 2 === 0 ? 0.7 : -0.7);
                        this.drawLeaf(40 * this.scale, 20 * this.scale, '#2d6a4f');
                        ctx.restore();
                    }
                }
                
                // Hoa nở
                if (this.bloom > 0.01) {
                    ctx.save();
                    ctx.translate(0, -this.stemLen);
                    ctx.scale(this.scale * this.bloom, this.scale * this.bloom);
                    
                    // Cánh hoa
                    for (let layer = 0; layer < 3; layer++) {
                        ctx.save();
                        ctx.rotate(layer * 0.4);
                        for (let i = 0; i < 6; i++) {
                            ctx.save();
                            ctx.rotate((i * Math.PI * 2) / 6);
                            this.drawLeaf(65 * (1 - layer * 0.15), 32 * (1 - layer * 0.15), '#ff4d6d', true);
                            ctx.restore();
                        }
                        ctx.restore();
                    }

                    // --- KHÔI PHỤC NHỤY HOA VÀNG ---
                    ctx.fillStyle = '#ffb703';
                    for (let i = 0; i < 6; i++) {
                        ctx.beginPath();
                        ctx.arc(Math.cos(i) * 6, Math.sin(i) * 6, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }
                ctx.restore();
            }
        }

        const flowers = []; 
        const grasses = [];
        const particles = [];

        function init() {
            flowers.length = 0; grasses.length = 0;
            const cx = canvas.width / 2;
            const by = canvas.height;
            const spacing = canvas.width < 500 ? canvas.width * 0.22 : 140;
            const baseH = canvas.width < 500 ? 180 : 280;

            flowers.push(new Flower(cx - spacing, by, -0.35, 0.55, baseH * 0.8, 60)); 
            flowers.push(new Flower(cx + spacing, by, 0.35, 0.55, baseH * 0.8, 100));
            flowers.push(new Flower(cx - spacing * 0.5, by, -0.15, 0.7, baseH * 0.9, 30)); 
            flowers.push(new Flower(cx + spacing * 0.5, by, 0.15, 0.7, baseH * 0.9, 50));
            flowers.push(new Flower(cx, by, 0, 0.9, baseH, 0));

            for (let i = 0; i < canvas.width; i += 10) {
                grasses.push({ x: i, h: 0, maxH: 25 + Math.random() * 30, off: Math.random() * Math.PI });
            }

            if(particles.length === 0) {
                for(let i=0; i<30; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 2 + 0.5,
                        speedY: -(Math.random() * 0.3 + 0.1)
                    });
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += p.speedY;
                if(p.y < 0) p.y = canvas.height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(Math.sin(frame * 0.02) * 0.5)})`;
                ctx.fill();
            });

            spawnHeart();
            hearts.forEach((h, i) => {
                h.y -= h.speed; h.life -= 0.005;
                if(h.life <= 0) hearts.splice(i, 1);
                ctx.save();
                ctx.globalAlpha = h.life;
                ctx.translate(h.x, h.y);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-h.size, -h.size, -h.size * 2, h.size / 2, 0, h.size);
                ctx.bezierCurveTo(h.size * 2, h.size / 2, h.size, -h.size, 0, 0);
                ctx.fillStyle = "#ff758f"; ctx.fill();
                ctx.restore();
            });

            grasses.forEach(g => {
                if (isStarted && g.h < g.maxH) g.h += (g.maxH - g.h) * 0.02 + 0.1;
                const sway = Math.sin(frame * 0.02 + g.off) * (g.h * 0.06);
                ctx.beginPath();
                ctx.moveTo(g.x, canvas.height);
                ctx.quadraticCurveTo(g.x + sway, canvas.height - g.h/2, g.x + sway*0.5, canvas.height - g.h);
                ctx.strokeStyle = '#2d6a4f'; ctx.lineWidth = 2; ctx.stroke();
            });

            flowers.forEach(f => f.draw());
            frame++;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
