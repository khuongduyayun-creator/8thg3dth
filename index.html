<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>8/3 tặng 12A1 NCT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600&family=Pacifico&display=swap');

        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            cursor: pointer;
        }

        /* --- MÂY TRẮNG RÕ NÉT --- */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 100px;
            opacity: 0.9; 
            filter: blur(4px); 
            z-index: 1;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            animation: moveClouds linear infinite;
        }
        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 100px;
        }
        @keyframes moveClouds {
            from { left: -250px; }
            to { left: 100%; }
        }

        /* --- CỤM CHỮ CHÚC MỪNG --- */
        .header {
            position: absolute;
            top: 60px;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        .header h1, .header .main-wish, .header .sub-wish {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header.show h1 { opacity: 1; transform: translateY(0); transition-delay: 0s; }
        .header.show .main-wish { opacity: 1; transform: translateY(0); transition-delay: 0.8s; }
        .header.show .sub-wish { opacity: 1; transform: translateY(0); transition-delay: 1.6s; }

        .header h1 {
            font-size: 2.8rem;
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(to right, #c9184a, #ff4d6d, #ff758f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            filter: drop-shadow(0 5px 10px rgba(255, 77, 109, 0.2));
            animation: floating 4s ease-in-out infinite;
        }

        /* Thay đổi font chữ cho 2 câu chúc */
        .header .main-wish {
            color: #800f2f;
            font-size: 1.4rem;
            margin-top: 15px;
            font-family: 'Quicksand', sans-serif; /* Font chữ hiện đại, dễ thương */
            font-weight: 600;
        }

        .header .sub-wish {
            color: #c9184a;
            font-size: 1.2rem;
            margin-top: 10px;
            font-family: 'Pacifico', cursive; /* Font chữ viết tay nghệ thuật */
            letter-spacing: 0.5px;
        }

        .hint {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4d6d;
            font-size: 1.2rem;
            text-align: center;
            animation: blink 2s infinite;
            z-index: 101;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        canvas { display: block; position: relative; z-index: 10; }
    </style>
</head>
<body onclick="startEverything()" ontouchstart="startEverything()">

    <div class="cloud" style="width: 160px; height: 55px; top: 10%; animation-duration: 25s;"></div>
    <div class="cloud" style="width: 260px; height: 85px; top: 25%; animation-duration: 35s; animation-delay: -5s;"></div>
    <div class="cloud" style="width: 140px; height: 45px; top: 15%; animation-duration: 20s; animation-delay: -12s;"></div>

    <audio id="bgMusic" loop>
        <source src="<iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2279731814&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"></iframe><div style="font-size: 10px; color: #cccccc;line-break: anywhere;word-break: normal;overflow: hidden;white-space: nowrap;text-overflow: ellipsis; font-family: Interstate,Lucida Grande,Lucida Sans Unicode,Lucida Sans,Garuda,Verdana,Tahoma,sans-serif;font-weight: 100;"><a href="https://soundcloud.com/04-nguy-n-ph-m-kh-ng-duy" title="04. Nguyễn Phạm Khương Duy" target="_blank" style="color: #cccccc; text-decoration: none;">04. Nguyễn Phạm Khương Duy</a> · <a href="https://soundcloud.com/04-nguy-n-ph-m-kh-ng-duy/nhacnen-2" title="nhacnen" target="_blank" style="color: #cccccc; text-decoration: none;">nhacnen</a></div>" type="audio/mpeg">
    </audio>

    <div class="header" id="mainHeader">
        <h1>Gửi những bông hoa xinh đẹp nhất 12A1</h1>
        <p class="main-wish">Chúc các bạn một ngày 8/3 rạng rỡ, luôn tự tin tỏa sáng và chinh phục thành công mọi ước mơ phí trước!</p>
        <p class="sub-wish">Mãi là những đóa hoa rạng rỡ nhất của 12a1 nhé! ✨</p>
    </div>

    <div class="hint" id="hintText">
        🌸 Chạm vào màn hình để nhận quà... 🌸
    </div>

    <canvas id="gardenCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gardenCanvas');
        const ctx = canvas.getContext('2d');
        const music = document.getElementById('bgMusic');
        const hint = document.getElementById('hintText');
        const header = document.getElementById('mainHeader');

        let isStarted = false;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let frame = 0;

        function startEverything() {
            if (!isStarted) {
                music.play().catch(() => {});
                isStarted = true;
                hint.style.display = 'none'; 
                header.classList.add('show');
            }
        }

        const particles = [];
        for(let i=0; i<50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speedY: -(Math.random() * 0.3 + 0.1)
            });
        }

        const hearts = [];
        function spawnHeart() {
            if (isStarted && frame % 45 === 0) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height + 20,
                    size: Math.random() * 7 + 4,
                    speed: Math.random() * 1.2 + 0.5,
                    life: 1.0
                });
            }
        }

        class Flower {
            constructor(startX, startY, angle, scale, maxLen, delay) {
                this.startX = startX; this.startY = startY;
                this.angle = angle; this.scale = scale;
                this.delay = delay; this.stemLen = 0;
                this.maxStemLen = maxLen; this.bloom = 0;
                this.swayOffset = Math.random() * Math.PI * 2;
            }

            drawLeaf(length, width, color, isPetal = false) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(width/2, -length*0.2, width/1.5, -length*0.6, 0, -length);
                ctx.bezierCurveTo(-width/1.5, -length*0.6, -width/2, -length*0.2, 0, 0);
                let grad = ctx.createLinearGradient(0, 0, 0, -length);
                if (isPetal) {
                    grad.addColorStop(0, '#800f2f'); grad.addColorStop(0.5, color); grad.addColorStop(1, '#ff758f');
                } else {
                    grad.addColorStop(0, '#132a13'); grad.addColorStop(1, '#2d6a4f');
                }
                ctx.fillStyle = grad; ctx.fill();
            }

            update() {
                if (isStarted && frame > this.delay) {
                    let stemGap = this.maxStemLen - this.stemLen;
                    if (stemGap > 0.1) this.stemLen += stemGap * 0.015 + 0.15; 
                    if (this.stemLen > this.maxStemLen * 0.6) {
                        let bloomGap = 1 - this.bloom;
                        if (bloomGap > 0.005) this.bloom += bloomGap * 0.012;
                    }
                }
            }

            draw() {
                this.update();
                if (this.stemLen <= 0) return;
                const sway = Math.sin(frame * 0.015 + this.swayOffset) * 0.02;
                ctx.save();
                ctx.translate(this.startX, this.startY);
                ctx.rotate(this.angle + sway);
                
                // Vẽ thân cây
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(0, -this.stemLen);
                ctx.strokeStyle = '#1b4332'; ctx.lineWidth = 10 * this.scale;
                ctx.lineCap = 'round'; ctx.stroke();
                
                // --- THÊM LÁ CHO CÂY ---
                if (this.stemLen > 50) {
                    for(let i=1; i<=3; i++) {
                        ctx.save();
                        // Lá mọc dọc theo thân tùy theo độ dài hiện tại
                        ctx.translate(0, -this.stemLen * (i/4.5)); 
                        ctx.rotate(i % 2 === 0 ? 0.7 : -0.7);
                        // Kích thước lá nhỏ dần khi lên cao
                        const leafScale = (1.2 - i*0.2) * this.scale;
                        this.drawLeaf(50 * leafScale, 25 * leafScale, '#2d6a4f');
                        ctx.restore();
                    }
                }
                
                if (this.bloom > 0.01) {
                    ctx.save();
                    ctx.translate(0, -this.stemLen);
                    ctx.scale(this.scale * this.bloom, this.scale * this.bloom);
                    for (let layer = 0; layer < 3; layer++) {
                        ctx.save();
                        ctx.rotate(layer * 0.4);
                        for (let i = 0; i < 8; i++) {
                            ctx.save();
                            ctx.rotate((i * Math.PI * 2) / 8);
                            this.drawLeaf(85 * (1 - layer * 0.15), 38 * (1 - layer * 0.15), '#ff4d6d', true);
                            ctx.restore();
                        }
                        ctx.restore();
                    }
                    ctx.fillStyle = '#ffb703';
                    for (let i = 0; i < 7; i++) {
                        ctx.beginPath();
                        ctx.arc(Math.cos(i) * 7, Math.sin(i) * 7, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
                ctx.restore();
            }
        }

        const flowers = []; const grasses = [];
        function init() {
            flowers.length = 0; grasses.length = 0;
            const cx = canvas.width / 2;
            const by = canvas.height + 20;
            flowers.push(new Flower(cx - 140, by, -0.45, 0.65, 250, 80)); 
            flowers.push(new Flower(cx + 140, by, 0.45, 0.65, 250, 120));
            flowers.push(new Flower(cx - 70, by, -0.15, 0.8, 230, 30)); 
            flowers.push(new Flower(cx + 70, by, 0.15, 0.8, 230, 50));
            flowers.push(new Flower(cx, by, 0, 1.0, 300, 0));

            for (let i = 0; i < canvas.width; i += 7) {
                grasses.push({ x: i, h: 0, maxH: 40 + Math.random() * 45, off: Math.random() * Math.PI });
            }
        }

        function drawDecor() {
            particles.forEach(p => {
                p.y += p.speedY;
                if(p.y < 0) p.y = canvas.height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(Math.sin(frame * 0.01) * 0.4)})`;
                ctx.fill();
            });

            spawnHeart();
            hearts.forEach((h, i) => {
                h.y -= h.speed; h.life -= 0.004;
                if(h.life <= 0) hearts.splice(i, 1);
                ctx.save();
                ctx.globalAlpha = h.life;
                ctx.translate(h.x, h.y);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-h.size, -h.size, -h.size * 2, h.size / 2, 0, h.size);
                ctx.bezierCurveTo(h.size * 2, h.size / 2, h.size, -h.size, 0, 0);
                ctx.fillStyle = "#ff758f"; ctx.fill();
                ctx.restore();
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawDecor();
            grasses.forEach(g => {
                if (isStarted && g.h < g.maxH) g.h += (g.maxH - g.h) * 0.02 + 0.12;
                const sway = Math.sin(frame * 0.02 + g.off) * (g.h * 0.06);
                ctx.beginPath();
                ctx.moveTo(g.x, canvas.height);
                ctx.quadraticCurveTo(g.x + sway, canvas.height - g.h/2, g.x + sway*0.5, canvas.height - g.h);
                ctx.strokeStyle = '#2d6a4f'; ctx.lineWidth = 3; ctx.stroke();
            });
            flowers.forEach(f => f.draw());
            frame++;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
